<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Llamado - Oficina de Bienes Municipales</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f1f5f9; margin: 0; padding: 25px; color: #0f172a; }
        .box { max-width: 1080px; margin: 0 auto; background: #fff; border-radius: 20px; padding: 32px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #dcfce7; padding-bottom: 18px; margin-bottom: 25px; flex-wrap: wrap; gap: 12px; }
        h2 { margin: 0; color: #15803d; font-size: 28px; font-weight: 900; }
        .header-acciones { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .status-badge { font-size: 14px; font-weight: 800; padding: 8px 16px; border-radius: 10px; background: #dcfce7; color: #15803d; }
        
        .fila { display: flex; justify-content: space-between; align-items: center; padding: 22px 25px; border: 2px solid #cbd5e1; border-left: 10px solid #16a34a; border-radius: 16px; margin-bottom: 18px; background: #f8fafc; transition: all 0.15s ease; gap: 15px; }
        .fila.ya-llamado { border-left-color: #f97316; background: #fffaf5; }
        .fila:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
        
        .cliente-bloque { display: flex; align-items: center; flex-grow: 1; min-width: 0; }
        .turno-id { font-size: 42px; font-weight: 900; color: #16a34a; margin-right: 22px; min-width: 92px; text-align: center; background: #dcfce7; border-radius: 12px; padding: 6px 10px; flex-shrink: 0; }
        .fila.ya-llamado .turno-id { color: #ea580c; background: #ffedd5; }
        
        .info-container { flex-grow: 1; min-width: 0; }
        .nombre-cliente { font-weight: 900; font-size: 23px; color: #0f172a; margin-bottom: 6px; text-transform: uppercase; word-wrap: break-word; }
        .detalle-resumen { color: #475569; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .acciones { display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
        
        button { border: none; padding: 14px 20px; border-radius: 12px; font-weight: 800; cursor: pointer; color: white; font-size: 15px; transition: transform 0.1s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        button:active { transform: scale(0.96); }
        
        .btn-ver { background: #0284c7; }
        .btn-ver:hover { background: #0369a1; }
        
        .btn-llamar { background: #16a34a; font-size: 16px; padding: 14px 24px; min-width: 145px; }
        .btn-llamar:hover { background: #15803d; }

        .btn-rellamar { background: #f97316; font-size: 16px; padding: 14px 24px; min-width: 145px; box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3); }
        .btn-rellamar:hover { background: #ea580c; }
        
        .btn-atender { background: #64748b; }
        .btn-atender:hover { background: #475569; }

        .btn-notif { background: #0284c7; font-size: 14px; padding: 10px 16px; }
        .btn-notif:hover { background: #0369a1; }

        #modalTramite { position: fixed; inset: 0; background: rgba(15,23,42,0.65); display: none; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
        .modal-card { background: #fff; border-radius: 20px; padding: 30px; width: 100%; max-width: 550px; box-shadow: 0 25px 50px rgba(0,0,0,0.25); }
        .modal-card h3 { margin: 0 0 15px 0; font-size: 24px; color: #15803d; border-bottom: 2px solid #dcfce7; padding-bottom: 12px; }
        .modal-body { font-size: 18px; color: #1e293b; font-weight: 600; line-height: 1.6; margin-bottom: 25px; background: #f8fafc; padding: 20px; border-radius: 12px; border: 1.5px solid #cbd5e1; word-break: break-word; }
        .btn-cerrar { width: 100%; padding: 14px; background: #0f172a; color: #fff; font-size: 16px; border-radius: 12px; font-weight: 800; cursor: pointer; }

        @media (max-width: 820px) {
            body { padding: 12px; }
            .box { padding: 20px; }
            h2 { font-size: 22px; }
            .fila { flex-direction: column; align-items: stretch; padding: 18px; }
            .detalle-resumen { white-space: normal; }
            .acciones { width: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
            button { width: 100%; min-width: 0; padding: 12px 10px; font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="box">
    <div class="header-bar">
        <h2>Oficina de Bienes Municipales — Turnos (B)</h2>
        <div class="header-acciones">
            <button class="btn-notif" id="btnPermisoNotif" type="button" onclick="activarAlertasYPermisos()">🔔 Activar Sonido y Notificaciones</button>
            <span id="estadoConexion" class="status-badge">Conectando...</span>
        </div>
    </div>
    <div id="listaTurnos">Cargando turnos...</div>
</div>

<div id="modalTramite">
    <div class="modal-card">
        <h3 id="modalTituloTurno">Detalle del Trámite</h3>
        <div class="modal-body" id="modalTextoTramite">---</div>
        <button class="btn-cerrar" onclick="cerrarModal()">Cerrar Ventana</button>
    </div>
</div>

<script>
const URL_WEB_APP_BIENES = "https://script.google.com/macros/s/AKfycbw7eaRPwFM-du9JAATEGmLIg4nCXBAmMBYJZoVBEcIQEDJj_mN6YbQq7lUhZywfcvh6/exec";
const CACHE_OFICINA_B = "cache_oficina_bienes_v6";
const CACHE_CERRADOS_B = "cache_turnos_cerrados_b_v3";

let turnosCerradosLocales = [];
let turnosPreviosIds = new Set();
let primeraCarga = true;
let audioCtxGlobal = null; // Variable para mantener el canal de audio desbloqueado

const operacionesPendientesB = new Set();
const operacionesConfirmadasB = new Map();
function idOperacionB() { return 'b-' + Date.now() + '-' + Math.random().toString(36).slice(2); }

function activarAlertasYPermisos() {
    // 1. Desbloquear el sistema de audio del navegador móvil mediante un toque de usuario
    try {
        audioCtxGlobal = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtxGlobal.state === 'suspended') {
            audioCtxGlobal.resume();
        }
        // Reproducir un micro-tono silencioso para liberar el bloqueo del sistema
        const osc = audioCtxGlobal.createOscillator();
        const gain = audioCtxGlobal.createGain();
        gain.gain.setValueAtTime(0.001, audioCtxGlobal.currentTime);
        osc.connect(gain);
        gain.connect(audioCtxGlobal.destination);
        osc.start();
        osc.stop(audioCtxGlobal.currentTime + 0.05);
    } catch (e) {
        console.error("Error al desbloquear audio:", e);
    }

    // 2. Solicitar permisos de notificaciones flotantes
    if (!("Notification" in window)) {
        alert("Este navegador no soporta notificaciones.");
        return;
    }
    Notification.requestPermission().then(permission => {
        const btn = document.getElementById("btnPermisoNotif");
        if (permission === "granted") {
            btn.style.background = "#16a34a";
            btn.textContent = "🔔 Alertas Activas";
            new Notification("Bienes Municipales", { body: "El celular ahora te notificará con sonido y alerta flotante." });
        } else {
            btn.style.background = "#dc2626";
            btn.textContent = "🔕 Notificaciones Bloqueadas";
        }
    });
}

function reproducirAlertaSonora() {
    try {
        if (!audioCtxGlobal) {
            audioCtxGlobal = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtxGlobal.state === 'suspended') {
            audioCtxGlobal.resume();
        }
        const osc = audioCtxGlobal.createOscillator();
        const gain = audioCtxGlobal.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtxGlobal.currentTime);
        osc.frequency.setValueAtTime(880, audioCtxGlobal.currentTime + 0.15);
        gain.gain.setValueAtTime(0.5, audioCtxGlobal.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtxGlobal.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(audioCtxGlobal.destination);
        osc.start();
        osc.stop(audioCtxGlobal.currentTime + 0.6);
    } catch (e) {
        console.error("Error al reproducir audio:", e);
    }
}

function lanzarNotificacionFlotante(titulo, mensaje) {
    if ("Notification" in window && Notification.permission === "granted") {
        try {
            new Notification(titulo, {
                body: mensaje,
                icon: "https://cdn-icons-png.flaticon.com/512/3233/3233483.png"
            });
        } catch (e) {}
    }
}

function accionUnicaB(url) {
    return new Promise(resolve => {
        const cb = 'cb_accion_b_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        const script = document.createElement('script');
        let terminado = false;
        const terminar = valor => {
            if (terminado) return;
            terminado = true;
            clearTimeout(timer);
            delete window[cb];
            script.remove();
            resolve(valor);
        };
        const timer = setTimeout(() => terminar(null), 18000);
        window[cb] = terminar;
        script.onerror = () => terminar(null);
        script.src = url + '&callback=' + encodeURIComponent(cb);
        document.body.appendChild(script);
    });
}

function peticionGoogleScript(urlCompleta) {
    return new Promise((resolve) => {
        fetch(urlCompleta, { cache: "no-store", signal: AbortSignal.timeout(4500) })
            .then(r => r.json())
            .then(data => resolve(data))
            .catch(() => {
                const cbName = "cb_of_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
                const script = document.createElement("script");
                const timer = setTimeout(() => { delete window[cbName]; script.remove(); resolve(null); }, 5000);
                window[cbName] = (res) => { clearTimeout(timer); delete window[cbName]; script.remove(); resolve(res); };
                const sep = urlCompleta.includes("?") ? "&" : "?";
                script.src = `${urlCompleta}${sep}callback=${cbName}`;
                script.onerror = () => { clearTimeout(timer); delete window[cbName]; script.remove(); resolve(null); };
                document.body.appendChild(script);
            });
    });
}

function pintarLista(activos) {
    const cont = document.getElementById("listaTurnos");
    const turnosValidos = activos;

    if (!turnosValidos.length) {
        cont.innerHTML = "<p style='color:#64748b;font-weight:bold;font-size:18px;text-align:center;padding:30px;'>No hay ciudadanos en espera en este momento.</p>";
        return;
    }

    cont.innerHTML = "";
    turnosValidos.forEach(x => {
        const esLlamado = String(x.Estado || "").trim().toLowerCase() === "llamado";
        const pendiente = operacionesPendientesB.has(String(x.ID));
        const div = document.createElement("div");
        div.className = "fila" + (esLlamado ? " ya-llamado" : "");

        const claseBotonLlamar = esLlamado ? "btn-rellamar" : "btn-llamar";
        const textoBotonLlamar = esLlamado ? "🔔 Re-llamar" : "🔊 Llamar";

        div.innerHTML = `
            <div class="cliente-bloque">
                <span class="turno-id">${x.ID}</span>
                <div class="info-container">
                    <div class="nombre-cliente">${x.Nombre || "SIN NOMBRE"}</div>
                    <div class="detalle-resumen">
                        <strong>Trámite:</strong> ${x.Tramite || "General"} | 
                        <strong>Estado:</strong> <span class="lbl-estado" style="color:${esLlamado ? '#ea580c' : '#15803d'};font-weight:800;">${x.Estado}</span>
                    </div>
                </div>
            </div>
            <div class="acciones">
                <button class="btn-ver" type="button">🔍 Ver</button>
                <button class="${claseBotonLlamar}" type="button">${textoBotonLlamar}</button>
                <button class="btn-atender" type="button">✔ Finalizar</button>
            </div>
        `;

        const botones = div.querySelectorAll("button");
        if (pendiente) {
            botones[1].disabled = true;
            botones[1].textContent = '⏳ Procesando...';
            botones[2].disabled = true;
        }
        botones[0].onclick = () => abrirModal(x.ID, x.Nombre || "SIN NOMBRE", x.Tramite || "Sin descripción");
        
        botones[1].onclick = async (ev) => {
            const id = String(x.ID);
            if (operacionesPendientesB.has(id)) return;
            operacionesPendientesB.add(id);
            const btn = ev.currentTarget;
            btn.disabled = true;
            botones[2].disabled = true;
            btn.textContent = '⏳ Llamando...';
            const req = idOperacionB();
            const r = await accionUnicaB(`${URL_WEB_APP_BIENES}?accion=llamar&id=${encodeURIComponent(id)}&requestId=${encodeURIComponent(req)}&t=${Date.now()}`);
            operacionesPendientesB.delete(id);
            botones[2].disabled = false;
            if (r && (r.ok === true || r.status === 'ok')) {
                operacionesConfirmadasB.set(id, Date.now());
                btn.className = 'btn-rellamar';
                btn.textContent = '🔔 Re-llamar';
                div.classList.add('ya-llamado');
                div.querySelector('.lbl-estado').textContent = 'Llamado';
            } else {
                btn.textContent = esLlamado ? '🔔 Re-llamar' : '🔊 Llamar';
                alert('No se pudo confirmar la llamada.');
            }
            btn.disabled = false;
            cargarTurnos();
        };

        botones[2].onclick = async () => {
            const id = String(x.ID);
            if (operacionesPendientesB.has(id)) return;
            operacionesPendientesB.add(id);
            botones[1].disabled = true;
            botones[2].disabled = true;
            botones[2].textContent = "Guardando...";
            const r = await accionUnicaB(`${URL_WEB_APP_BIENES}?accion=atender&id=${encodeURIComponent(x.ID)}&requestId=${encodeURIComponent(idOperacionB())}&t=${Date.now()}`);
            operacionesPendientesB.delete(id);
            if (r && r.ok === true) {
                div.style.opacity = "0";
                setTimeout(() => div.remove(), 250);
                cargarTurnos();
            } else {
                botones[1].disabled = false;
                botones[2].disabled = false;
                botones[2].textContent = "✔ Finalizar";
                alert("No se pudo confirmar el turno resuelto.");
            }
        };

        cont.appendChild(div);
    });
}

function restaurarCacheLocal() {
    try {
        turnosCerradosLocales = JSON.parse(localStorage.getItem(CACHE_CERRADOS_B) || "[]");
        const guardado = JSON.parse(localStorage.getItem(CACHE_OFICINA_B) || "[]");
        if (Array.isArray(guardado) && guardado.length) {
            guardado.forEach(x => turnosPreviosIds.add(String(x.ID)));
            pintarLista(guardado);
        }
    } catch (e) {}
}

async function cargarTurnos() {
    const badge = document.getElementById("estadoConexion");
    if (!URL_WEB_APP_BIENES.includes("script.google.com")) {
        badge.style.background = "#fee2e2";
        badge.style.color = "#b91c1c";
        badge.textContent = "Falta pegar URL .exec";
        return;
    }

    if (cargarTurnos.ocupado) return;
    cargarTurnos.ocupado = true;
    try {
        const j = await peticionGoogleScript(`${URL_WEB_APP_BIENES}?accion=estado&t=${Date.now()}`);
        if (j && Array.isArray(j.datos)) {
            const activos = j.datos.filter(x => String(x.Estado || "").toLowerCase() !== "atendido");
            
            const nuevosIdsActuales = new Set(activos.map(x => String(x.ID)));
            if (!primeraCarga) {
                let hayClienteNuevo = false;
                let nombreNuevo = "";
                let turnoNuevoID = "";

                for (let x of activos) {
                    const idStr = String(x.ID);
                    if (!turnosPreviosIds.has(idStr)) {
                        hayClienteNuevo = true;
                        turnoNuevoID = idStr;
                        nombreNuevo = x.Nombre || "Sin nombre";
                        break;
                    }
                }

                if (hayClienteNuevo) {
                    const esMovil = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                    
                    if (esMovil) {
                        // Reproduce la alarma sonora en el celular
                        reproducirAlertaSonora();
                    }
                    // Muestra la notificación flotante
                    lanzarNotificacionFlotante("¡Nuevo Cliente Adicional!", `Turno #${turnoNuevoID}: ${nombreNuevo}`);
                }
            } else {
                primeraCarga = false;
            }

            turnosPreviosIds = nuevosIdsActuales;
            localStorage.setItem(CACHE_OFICINA_B, JSON.stringify(activos));
            badge.style.background = "#dcfce7";
            badge.style.color = "#15803d";
            badge.textContent = `🟢 En línea`;
            if (operacionesPendientesB.size === 0) pintarLista(activos);
        }
    } catch (e) {} finally { cargarTurnos.ocupado = false; }
}

function abrirModal(id, nombre, tramite) {
    document.getElementById("modalTituloTurno").textContent = `Turno ${id} — ${nombre}`;
    document.getElementById("modalTextoTramite").textContent = tramite;
    document.getElementById("modalTramite").style.display = "flex";
}

function cerrarModal() {
    document.getElementById("modalTramite").style.display = "none";
}

if ("Notification" in window && Notification.permission === "granted") {
    const btn = document.getElementById("btnPermisoNotif");
    btn.style.background = "%#16a34a"; // se corrige abajo
    btn.style.background = "#16a34a";
    btn.textContent = "🔔 Alertas Activas";
}

restaurarCacheLocal();
cargarTurnos();
setInterval(cargarTurnos, 5000);
</script>
</body>
</html>
